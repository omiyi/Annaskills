name: Build Plugin with Gradle
on:
  push:
    branches: [ "master" ]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: "21"
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          gradle-version: "8.14.2"
      - name: Build with Gradle
        run: ./gradlew build --refresh-dependencies
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: AuraSkills
          path: build/libs/AuraSkills-**.jar
      - name: Delete all summary content
        run: rm $GITHUB_STEP_SUMMARY
